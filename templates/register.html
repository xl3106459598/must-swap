{% extends 'base.html' %}
{% block title %}Register — CampusMarket{% endblock %}

{% block content %}
<section class="auth-section" id="register-section">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <h1 class="auth-title">Create Account</h1>
            <p class="auth-subtitle">Join the campus marketplace community</p>
        </div>

        <form class="auth-form" method="POST" action="{{ url_for('register') }}" id="register-form">
            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" name="name" id="reg-name" placeholder=" "
                           value="{{ name if name else '' }}" required>
                    <label for="reg-name">Full Name</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" name="email" id="reg-email" placeholder=" "
                           value="{{ email if email else '' }}" required>
                    <label for="reg-email">Email Address</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72"/>
                    </svg>
                    <input type="tel" name="phone" id="reg-phone" placeholder=" "
                           value="{{ phone if phone else '' }}" required>
                    <label for="reg-phone">Phone Number</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="password" id="reg-password" placeholder=" "
                           minlength="6" required>
                    <label for="reg-password">Password</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="confirm_password" id="reg-confirm-password" placeholder=" "
                           minlength="6" required>
                    <label for="reg-confirm-password">Confirm Password</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="register-submit-btn">
                Create Account
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>

        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('login') }}" class="auth-link">Log in</a>
        </p>
    </div>
</section>
{% endblock %}
