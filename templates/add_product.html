{% extends 'base.html' %}
{% block title %}Add Product — CampusMarket{% endblock %}

{% block content %}
<section class="form-section" id="add-product-section">
    <div class="form-card glass-card">
        <div class="form-header">
            <h1 class="form-title">List a Product</h1>
            <p class="form-subtitle">Fill in the details to list your item for sale</p>
        </div>

        <form class="product-form" method="POST" action="{{ url_for('add_product') }}"
              enctype="multipart/form-data" id="add-product-form">

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                    <input type="text" name="name" id="product-name" placeholder=" "
                           value="{{ name if name else '' }}" required>
                    <label for="product-name">Product Name</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper input-wrapper--textarea">
                    <textarea name="description" id="product-description" placeholder=" "
                              rows="4">{{ description if description else '' }}</textarea>
                    <label for="product-description">Description</label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon input-icon--text">₹</span>
                        <input type="number" name="price" id="product-price" placeholder=" "
                               value="{{ price if price else '' }}" min="1" step="1" required>
                        <label for="product-price">Price</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper input-wrapper--select">
                        <label for="product-category" class="select-label">Category</label>
                        <select name="category_id" id="product-category" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}"
                                    {% if category_id and category_id|string == cat.id|string %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="image-upload" id="image-upload">
                    <input type="file" name="image" id="product-image-input"
                           accept="image/png, image/jpeg, image/gif, image/webp">
                    <label for="product-image-input" class="image-upload-label" id="image-upload-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <span>Click to upload product image</span>
                        <small>PNG, JPG, GIF, WebP — Max 5MB</small>
                    </label>
                    <div class="image-preview" id="image-preview" style="display:none;">
                        <img id="preview-img" alt="Preview">
                        <button type="button" class="btn-remove-image" id="remove-image-btn"
                                onclick="removeImagePreview()">&times;</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="add-product-submit-btn">
                List Product
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </button>
        </form>
    </div>
</section>
{% endblock %}
