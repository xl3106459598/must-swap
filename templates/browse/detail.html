{% extends 'base.html' %}{% block content %}<article class="panel"><h1>{{ p.name }}</h1>{% if p.image %}<img class="photo" src="{{ url_for('uploaded_image',filename=p.image) }}" alt="{{ p.name }}">{% endif %}<p>{{ p.price|money }}</p><p>{{ p.description }}</p><p>{{ p.category_name }}</p><a href="{{ url_for('browse.seller',user_id=p.seller_id) }}">{{ p.seller_name }}</a></article>{% endblock %}
