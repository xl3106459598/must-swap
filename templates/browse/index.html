{% extends 'base.html' %}{% block content %}<h1>Campus marketplace</h1><div class="grid">{% for p in products %}<article class="card"><a href="{{ url_for('browse.detail',product_id=p.id) }}">{% if p.image %}<img src="{{ url_for('uploaded_image',filename=p.image) }}" alt="{{ p.name }}">{% endif %}<h2>{{ p.name }}</h2></a><p>{{ p.price|money }}</p><p class="meta">{{ p.category_name }} | {{ p.status|title }}</p></article>{% else %}<p>No listings found.</p>{% endfor %}</div>{% endblock %}
