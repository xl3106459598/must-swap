{% extends 'base.html' %}
{% block title %}Edit Product — CampusMarket{% endblock %}

{% block content %}
<section class="form-section" id="edit-product-section">
    <div class="form-card glass-card">
        <div class="form-header">
            <h1 class="form-title">Edit Product</h1>
            <p class="form-subtitle">Update your listing details</p>
        </div>

        <form class="product-form" method="POST"
              action="{{ url_for('edit_product', product_id=product.id) }}"
              enctype="multipart/form-data" id="edit-product-form">

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
                    </svg>
                    <input type="text" name="name" id="edit-product-name" placeholder=" "
                           value="{{ product.name }}" required>
                    <label for="edit-product-name">Product Name</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper input-wrapper--textarea">
                    <textarea name="description" id="edit-product-description" placeholder=" "
                              rows="4">{{ product.description if product.description else '' }}</textarea>
                    <label for="edit-product-description">Description</label>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <div class="input-wrapper">
                        <span class="input-icon input-icon--text">₹</span>
                        <input type="number" name="price" id="edit-product-price" placeholder=" "
                               value="{{ product.price }}" min="1" step="1" required>
                        <label for="edit-product-price">Price</label>
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-wrapper input-wrapper--select">
                        <label for="edit-product-category" class="select-label">Category</label>
                        <select name="category_id" id="edit-product-category" required>
                            <option value="">Select category</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}"
                                    {% if product.category_id == cat.id %}selected{% endif %}>
                                    {{ cat.name }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <div class="image-upload" id="image-upload">
                    <input type="file" name="image" id="product-image-input"
                           accept="image/png, image/jpeg, image/gif, image/webp">
                    {% if product.image %}
                        <div class="current-image">
                            <p class="current-image-label">Current Image:</p>
                            <img src="{{ url_for('static', filename='uploads/' + product.image) }}"
                                 alt="{{ product.name }}" class="current-image-preview">
                        </div>
                    {% endif %}
                    <label for="product-image-input" class="image-upload-label" id="image-upload-label">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                        <span>{{ 'Change product image' if product.image else 'Upload product image' }}</span>
                        <small>PNG, JPG, GIF, WebP — Max 5MB</small>
                    </label>
                    <div class="image-preview" id="image-preview" style="display:none;">
                        <img id="preview-img" alt="New image preview">
                        <button type="button" class="btn-remove-image" id="remove-image-btn"
                                onclick="removeImagePreview()">&times;</button>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="edit-product-submit-btn">
                Update Product
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
                    <polyline points="20 6 9 17 4 12"/>
                </svg>
            </button>
        </form>

        <a href="{{ url_for('my_listings') }}" class="btn btn-outline btn-full" style="margin-top: 0.75rem;"
           id="cancel-edit-btn">Cancel</a>
    </div>
</section>
{% endblock %}
