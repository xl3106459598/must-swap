{% extends 'base.html' %}
{% block title %}Login — CampusMarket{% endblock %}

{% block content %}
<section class="auth-section" id="login-section">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to your CampusMarket account</p>
        </div>

        <form class="auth-form" method="POST" action="{{ url_for('login') }}" id="login-form">
            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
                    </svg>
                    <input type="email" name="email" id="login-email" placeholder=" "
                           value="{{ email if email else '' }}" required>
                    <label for="login-email">Email Address</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" name="password" id="login-password" placeholder=" " required>
                    <label for="login-password">Password</label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="login-submit-btn">
                Log In
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px">
                    <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
                </svg>
            </button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}" class="auth-link">Register now</a>
        </p>
    </div>
</section>
{% endblock %}
